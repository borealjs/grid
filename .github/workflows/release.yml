name: Release

# Publishes to npm when a GitHub release is published (tag vX.Y.Z matching the package versions).
# Authenticates with npm trusted publishing (OIDC): no npm token is stored in this repository, and
# every package gets a provenance attestation linking it to this workflow run.
on:
  release:
    types: [published]
  workflow_dispatch: # re-run by hand: publishes whatever version is not on npm yet

permissions:
  contents: read
  id-token: write # lets npm verify this workflow (trusted publishing)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No registry-url here: it would make npm use a token instead of trusted publishing.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: npm with trusted publishing support (11.5.1+)
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Publish
        run: node scripts/publish-packages.mjs ${{ github.event_name == 'release' && format('--tag {0}', github.event.release.tag_name) || '' }}
